<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="interaction.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="canvas">
            <div id="canvas-row-container"></div>
        </div>
        <div class="settings-container">
            <div class="grid-settings interactive">
                <label for="grid-selector">Specify Grid Size</label>
                <input 
                    type="number"
                    id="grid-selector"
                    name="grid-selector"
                    max="64"
                    value="16"
                >
                    
            </div>
            <div class="color-select-container">
                <label>Choose A Color</label>
                <input
                    type="color"
                    id="color-selector"
                >
            </div>
            <button class="interactive" id="reset">Reset</button>
            <button class="interactive" id="apply">Apply</button>
        </div>
    </div>
</body>
</html>
